  <path d="M150,133 L650,133 L650,142 L150,142 Z" fill="#9a6e4a" opacity="0.5" filter="url(#wash-fine)"/>
  <g fill="none" stroke="#5f4a3a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" filter="url(#pencil)">
    <path d="M150,118 L650,118 C660,118 664,140 650,142 L150,142 C140,140 140,120 150,118"/>
    <path d="M200,126 C280,124 350,128 400,126 M470,130 C540,128 600,132 630,129"/>
  </g>

