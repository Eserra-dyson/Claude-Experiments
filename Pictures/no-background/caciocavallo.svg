  <g fill="none" stroke="#5f4a3a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.76" filter="url(#pencil)">
    <path d="M150,612 L640,594 L692,676 L120,696 L150,612"/>
    <path d="M120,696 L120,708 L692,688 L692,676"/>
  </g>

