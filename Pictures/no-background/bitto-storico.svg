    <ellipse cx="603" cy="585" rx="4.2" ry="3.4" fill="#c99f52" opacity="0.8"/><path d="M598.9,585.5 A4.2,3.4 0 0 0 607.3,585.5" fill="none" stroke="#fff6dc" stroke-width="1.2"/>
    <ellipse cx="565" cy="446" rx="5.6" ry="4.5" fill="#c99f52" opacity="0.8"/><path d="M559.3,446.9 A5.6,4.5 0 0 0 570.4,446.9" fill="none" stroke="#fff6dc" stroke-width="1.2"/>
    <ellipse cx="641" cy="561" rx="4.2" ry="3.4" fill="#c99f52" opacity="0.8"/><path d="M637.1,561.7 A4.2,3.4 0 0 0 645.5,561.7" fill="none" stroke="#fff6dc" stroke-width="1.2"/>
    <ellipse cx="573" cy="429" rx="2.7" ry="2.2" fill="#c99f52" opacity="0.8"/><path d="M569.9,430.2 A2.7,2.2 0 0 0 575.4,430.2" fill="none" stroke="#fff6dc" stroke-width="1.2"/>
    <ellipse cx="558" cy="588" rx="5.9" ry="4.8" fill="#c99f52" opacity="0.8"/><path d="M552.2,589.0 A5.9,4.8 0 0 0 564.1,589.0" fill="none" stroke="#fff6dc" stroke-width="1.2"/>
    <ellipse cx="631" cy="496" rx="3.4" ry="2.7" fill="#c99f52" opacity="0.8"/><path d="M627.4,497.4 A3.4,2.7 0 0 0 634.1,497.4" fill="none" stroke="#fff6dc" stroke-width="1.2"/>
    <ellipse cx="536" cy="575" rx="5.3" ry="4.2" fill="#c99f52" opacity="0.8"/><path d="M530.5,575.7 A5.3,4.2 0 0 0 541.0,575.7" fill="none" stroke="#fff6dc" stroke-width="1.2"/>
    <ellipse cx="574" cy="519" rx="5.5" ry="4.4" fill="#c99f52" opacity="0.8"/><path d="M568.4,519.7 A5.5,4.4 0 0 0 579.3,519.7" fill="none" stroke="#fff6dc" stroke-width="1.2"/>
  </g>
  <g fill="none" stroke="#5f4a3a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity="0.76" filter="url(#pencil)">
    <path d="M585,352 L468,650 Q587,696 706,628"/>
    <path d="M585,352 L606,342 L734,604 L706,628"/>
    <path d="M585,352 L706,628"/>
  </g>

</svg>
