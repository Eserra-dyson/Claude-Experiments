<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="63.5mm" height="88.9mm">
  <title>Watercolour paper — poker card (63.5 × 88.9 mm)</title>
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="4" seed="11" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="0.55" result="lit">
        <feDistantLight azimuth="45" elevation="78"/>
      </feDiffuseLighting>
      <feFlood flood-color="#fbf5ea" result="base"/>
      <feBlend in="lit" in2="base" mode="multiply"/>
    </filter>
    <clipPath id="card"><rect width="750" height="1050" rx="37.5"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="750" height="1050" filter="url(#paper)"/>
  </g>
</svg>
